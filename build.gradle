plugins {
    id 'java'
}

version = '1.0'
base { archivesName = 'NeoWex' }

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8
sourceSets.main.java.srcDirs = ['src']

ext {
    // ĐỔI số này cho khớp bản game (tag trên github.com/Anuken/Mindustry). Mod yêu cầu game >= 157.
    mindustryVersion = 'v157.4'
    sdkRoot = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    compileOnly("com.github.Anuken.Mindustry:core:$mindustryVersion") { transitive = false }
    compileOnly "com.github.Anuken.Arc:arc-core:$mindustryVersion"
    compileOnly "com.github.Anuken.Arc:g3d:$mindustryVersion"
    compileOnly "com.github.Anuken.Arc:fx:$mindustryVersion"
    compileOnly "com.github.Anuken.Arc:arcnet:$mindustryVersion"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 1) jar cho PC: file .class + mod.hjson + toàn bộ tài nguyên (content, sprites, maps, sounds, music...)
jar {
    archiveFileName = 'NeoWexDesktop.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(rootDir) {
        include 'mod.hjson', 'mod.json', 'icon.png'
        include 'content/**', 'sprites/**', 'maps/**', 'file/**', 'music/**', 'sounds/**', 'bundles/**', 'shaders/**'
        // KHÔNG đưa scripts/*.js vào jar: mod đã chuyển sang Java.
    }
}

// 2) chuyển sang dex (classes.dex) để chạy trên Android
tasks.register('jarAndroid') {
    dependsOn jar
    doLast {
        if (!sdkRoot || !new File(sdkRoot).exists()) {
            throw new GradleException('Không tìm thấy Android SDK (ANDROID_HOME). Không có SDK thì không tạo được classes.dex cho Android.')
        }

        // so sánh số phiên bản theo từng số (34 < 36, 9 < 34)
        def parts = { String s -> (s =~ /\d+/).collect { it as int } }
        def cmp = { String a, String b ->
            def x = parts(a), y = parts(b)
            for (int i = 0; i < Math.max(x.size(), y.size()); i++) {
                int p = i < x.size() ? x[i] : 0
                int q = i < y.size() ? y[i] : 0
                if (p != q) return p <=> q
            }
            return 0
        }

        def platform = (new File(sdkRoot, 'platforms').listFiles() ?: [])
                .findAll { it.isDirectory() && it.name ==~ /android-\d+/ && new File(it, 'android.jar').exists() }
                .max { a, b -> cmp(a.name, b.name) }
        def tools = (new File(sdkRoot, 'build-tools').listFiles() ?: [])
                .findAll { it.isDirectory() && it.name ==~ /\d+(\.\d+)*/ && new File(it, 'd8').exists() }
                .max { a, b -> cmp(a.name, b.name) }
        if (platform == null || tools == null) throw new GradleException('Thiếu android.jar hoặc d8 trong Android SDK.')
        println "Dùng platform ${platform.name}, build-tools ${tools.name}"

        def out = new File(buildDir, 'libs/NeoWexAndroid.jar')
        out.parentFile.mkdirs()
        out.delete()

        def cmd = [new File(tools, 'd8').path,
                   '--lib', new File(platform, 'android.jar').path]
        configurations.compileClasspath.files.each { cmd += ['--classpath', it.path] }
        cmd += ['--min-api', '14', '--output', out.path, jar.archiveFile.get().asFile.path]

        def result = exec {
            commandLine cmd
            ignoreExitValue = true
        }
        if (result.exitValue != 0) throw new GradleException("d8 lỗi (exit ${result.exitValue}), xem log phía trên.")
        checkDex(out)
    }
}

def checkDex(File f) {
    if (!f.exists()) throw new GradleException("Không có file ${f.name}")
    def zf = new java.util.zip.ZipFile(f)
    try {
        if (zf.getEntry('classes.dex') == null) throw new GradleException("${f.name} KHÔNG có classes.dex -> sẽ lỗi ClassNotFound trên Android")
    } finally { zf.close() }
}

// 3) gộp PC + Android thành 1 file mod: NeoWex.jar
tasks.register('deploy', Jar) {
    dependsOn jarAndroid
    archiveFileName = 'NeoWex.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { zipTree(jar.archiveFile.get().asFile) }
    from { zipTree(new File(buildDir, 'libs/NeoWexAndroid.jar')) }
    doLast { checkDex(archiveFile.get().asFile) }
}
